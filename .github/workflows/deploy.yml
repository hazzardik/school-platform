name: Publish School Platform

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Run JavaScript and security checks
        run: |
          node --check app.js
          node tests/smoke.mjs
          node tests/security-and-plus.mjs
          node tests/regions-roles-themes.mjs

      - name: Prepare static site
        run: |
          mkdir -p site
          cp index.html app.js styles.css config.js school-directory.js favicon.svg site/
          touch site/.nojekyll
          test -f site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
